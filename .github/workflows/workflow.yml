name: Build Executables

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt6 pillow

      - name: Build CLI converter
        shell: bash
        run: |
          pyinstaller --onefile \
            --name eop_to_midi \
            --add-data "converter.png:." \
            eop_to_midi.py

      - name: Build GUI converter
        shell: bash
        run: |
          pyinstaller --onefile \
            --windowed \
            --name EOP2MID-GUI \
            --add-data "converter.png:." \
            gui_converter.py

      - name: Prepare artifact folder
        shell: bash
        run: |
          mkdir -p artifacts
          cp dist/* artifacts/ || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eop2mid-ubuntu-py3.11
          path: artifacts/*
