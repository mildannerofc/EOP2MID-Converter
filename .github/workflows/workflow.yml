name: Build Executables

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt6 pillow

      - name: Convert icon for Windows
        if: runner.os == 'Windows'
        shell: python
        run: |
          from PIL import Image

          img = Image.open("converter.png")
          rgba = img.convert("RGBA")
          rgba.save("converter.ico")

      - name: Build CLI converter (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pyinstaller --onefile \
            --name eop_to_midi \
            --icon=converter.ico \
            --add-data "converter.ico;." \
            eop_to_midi.py

      - name: Build CLI converter (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          pyinstaller --onefile \
            --name eop_to_midi \
            --icon=converter.png \
            --add-data "converter.png:." \
            eop_to_midi.py

      - name: Build GUI converter (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pyinstaller --onefile \
            --windowed \
            --name EOP2MID-GUI \
            --icon=converter.ico \
            --add-data "converter.ico;." \
            gui_converter.py

      - name: Build GUI converter (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          pyinstaller --onefile \
            --windowed \
            --name EOP2MID-GUI \
            --icon=converter.png \
            --add-data "converter.png:." \
            gui_converter.py

      - name: Prepare artifact folder
        shell: bash
        run: |
          mkdir -p artifacts
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp dist/*.exe artifacts/ || true
          else
            cp dist/* artifacts/ || true
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eop2mid-${{ runner.os }}-py${{ matrix.python-version }}
          path: artifacts/*
