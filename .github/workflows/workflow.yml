name: Build Executables

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt6 pillow

      - name: Validate required music asset
        shell: bash
        run: |
          if [ ! -f "relaxing_music.mp3" ]; then
            echo "ERROR: relaxing_music.mp3 is required in the repository root."
            exit 1
          fi
          echo "Bundling relaxing_music.mp3 into the GUI executable."

      - name: Validate Python syntax
        shell: bash
        run: |
          python -m py_compile gui_converter.py eop_to_midi.py

      - name: Convert icon for Windows
        if: runner.os == 'Windows'
        shell: python
        run: |
          from PIL import Image

          img = Image.open("converter.png")
          rgba = img.convert("RGBA")
          rgba.save("converter.ico")

      - name: Build CLI converter (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pyinstaller --onefile \
            --name eop_to_midi \
            --icon=converter.ico \
            --add-data "converter.ico;." \
            eop_to_midi.py

      - name: Build CLI converter (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          pyinstaller --onefile \
            --name eop_to_midi \
            --icon=converter.png \
            --add-data "converter.png:." \
            eop_to_midi.py

      - name: Build GUI converter (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          AUDIO_DATA='--add-data relaxing_music.mp3;.'
          if [ -f "relaxing_music.wav" ]; then
            AUDIO_DATA="$AUDIO_DATA --add-data relaxing_music.wav;."
          fi

          pyinstaller --onefile \
            --windowed \
            --name EOP2MID-GUI \
            --icon=converter.ico \
            --add-data "converter.ico;." \
            --add-data "converter.png;." \
            $AUDIO_DATA \
            --collect-all PyQt6 \
            --collect-submodules PyQt6.QtMultimedia \
            gui_converter.py

      - name: Build GUI converter (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          AUDIO_DATA='--add-data relaxing_music.mp3:.'
          if [ -f "relaxing_music.wav" ]; then
            AUDIO_DATA="$AUDIO_DATA --add-data relaxing_music.wav:."
          fi

          pyinstaller --onefile \
            --windowed \
            --name EOP2MID-GUI \
            --icon=converter.png \
            --add-data "converter.png:." \
            $AUDIO_DATA \
            --collect-all PyQt6 \
            --collect-submodules PyQt6.QtMultimedia \
            gui_converter.py

      - name: Prepare artifact folder
        shell: bash
        run: |
          mkdir -p artifacts
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp dist/*.exe artifacts/ || true
          else
            cp dist/* artifacts/ || true
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eop2mid-${{ runner.os }}-py3.11
          path: artifacts/*
